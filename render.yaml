services:
  # Backend API (Express + MongoDB)
  - name: spike-city-backend
    type: web
    runtime: node
    plan: free
    rootDir: spike-city-backend
    buildCommand: yarn install
    startCommand: node index.js
    envVars:
      - key: VOLLEYBALL_DB_URI
        sync: false # set manually in Render dashboard (MongoDB Atlas connection string)
      - key: VOLLEYBALL_COLLECTION
        sync: false # set manually in Render dashboard (Mongo database name)
      - key: FRONTEND_URL
        sync: false # set manually once the frontend URL below is known, e.g. https://spike-city-frontend.onrender.com

  # Frontend (Create React App, served as a static site)
  - name: spike-city-frontend
    type: web
    runtime: static
    rootDir: spike-city-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false # set manually in Render dashboard, e.g. https://spike-city-backend.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false # set manually in Render dashboard (Google OAuth client ID)
